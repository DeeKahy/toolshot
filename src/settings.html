<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toolshot Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b1c20;
      color: #ddd;
      font-family: -apple-system, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px;
      height: 100%;
    }
    h1 { font-size: 14px; color: #fff; }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #232428;
      border: 1px solid #303138;
      border-radius: 8px;
      padding: 10px 14px;
    }
    .row .name { flex: 1; font-size: 13px; }
    .row .sub { font-size: 11px; color: #778; margin-top: 2px; }
    .bind {
      min-width: 150px;
      text-align: center;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      color: #ddd;
      background: #2a2b30;
      border: 1px solid #34353c;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .bind:hover { background: #33343a; }
    .bind.recording {
      border-color: #4da3ff;
      color: #4da3ff;
    }
    .bind.unset { color: #667; }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: #3a6ea5; }
    #status {
      min-height: 16px;
      font-size: 12px;
      color: #c66;
      text-align: center;
    }
    #footer {
      margin-top: auto;
      font-size: 11px;
      color: #667;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>Settings</h1>
    <div class="row">
      <div>
        <div class="name">Capture</div>
        <div class="sub">Window click or area drag</div>
      </div>
      <div class="bind unset" id="bind-capture" data-kind="capture">Not set</div>
    </div>
    <div class="row">
      <div>
        <div class="name">Color picker</div>
        <div class="sub">Pick a pixel anywhere on screen</div>
      </div>
      <div class="bind unset" id="bind-picker" data-kind="picker">Not set</div>
    </div>
    <div class="row">
      <div class="name">Launch at login</div>
      <input type="checkbox" id="autostart" />
    </div>
    <div class="row">
      <div>
        <div class="name">Updates</div>
        <div class="sub" id="version"></div>
      </div>
      <div class="bind" id="updateBtn">Check for updates</div>
    </div>
    <div id="status"></div>
    <div id="footer">Click a binding, then press a shortcut with at least one modifier.<br>Backspace clears it, Esc cancels recording.</div>
  </div>
  <script>
    const invoke = window.__TAURI__.core.invoke;
    const status = document.getElementById("status");
    let recording = null; // the .bind element currently listening

    function pretty(accel) {
      return accel
        .replaceAll("Key", "")
        .replaceAll("Digit", "")
        .replaceAll("Arrow", "");
    }

    function render(el, accel) {
      el.classList.remove("recording");
      if (accel) {
        el.textContent = pretty(accel);
        el.classList.remove("unset");
      } else {
        el.textContent = "Not set";
        el.classList.add("unset");
      }
    }

    invoke("get_settings").then((s) => {
      render(document.getElementById("bind-capture"), s.capture_shortcut);
      render(document.getElementById("bind-picker"), s.picker_shortcut);
    });

    const autostart = document.getElementById("autostart");
    invoke("get_autostart").then((on) => { autostart.checked = on; });
    autostart.addEventListener("change", () => {
      invoke("set_autostart", { enabled: autostart.checked }).catch((e) => {
        status.textContent = String(e);
        autostart.checked = !autostart.checked;
      });
    });

    let current = {};
    invoke("get_settings").then((s) => { current = s; });

    const SITE = "https://deekahy.github.io/toolshot/";
    const updateBtn = document.getElementById("updateBtn");
    let appVersion = null;
    let downloadReady = false;

    invoke("get_app_version").then((v) => {
      appVersion = v;
      document.getElementById("version").textContent = "Version " + v;
    });

    function newer(a, b) {
      const pa = a.split(".").map(Number);
      const pb = b.split(".").map(Number);
      for (let i = 0; i < 3; i++) {
        if ((pa[i] || 0) > (pb[i] || 0)) return true;
        if ((pa[i] || 0) < (pb[i] || 0)) return false;
      }
      return false;
    }

    updateBtn.addEventListener("click", async () => {
      if (downloadReady) {
        invoke("open_url", { url: SITE });
        return;
      }
      updateBtn.textContent = "Checking...";
      try {
        const res = await fetch("https://api.github.com/repos/DeeKahy/toolshot/releases/latest");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const release = await res.json();
        const latest = release.tag_name.replace(/^v/, "");
        if (appVersion && newer(latest, appVersion)) {
          updateBtn.textContent = "Get v" + latest;
          downloadReady = true;
        } else {
          updateBtn.textContent = "Up to date";
        }
      } catch (e) {
        updateBtn.textContent = "Check failed";
        status.textContent = "Update check failed: " + String(e);
      }
    });

    for (const el of document.querySelectorAll(".bind")) {
      el.addEventListener("click", () => {
        if (recording) render(recording, currentAccel(recording));
        recording = el;
        el.classList.add("recording");
        el.textContent = "Press keys...";
        status.textContent = "";
      });
    }

    function currentAccel(el) {
      return el.dataset.kind === "capture" ? current.capture_shortcut : current.picker_shortcut;
    }

    function keyOk(code) {
      return /^(Key[A-Z]|Digit[0-9]|F([1-9]|1[0-2])|Space|Comma|Period|Slash|Backslash|Semicolon|Quote|Backquote|Minus|Equal|Enter|Tab|Arrow(Up|Down|Left|Right))$/.test(code);
    }

    async function saveBinding(el, accel) {
      const kind = el.dataset.kind;
      try {
        await invoke("set_shortcut", { kind, accel });
        if (kind === "capture") current.capture_shortcut = accel;
        else current.picker_shortcut = accel;
        render(el, accel);
      } catch (e) {
        status.textContent = "Could not register: " + String(e);
        render(el, currentAccel(el));
      }
    }

    document.addEventListener("keydown", (e) => {
      if (!recording) {
        if (e.key === "Escape") invoke("close_settings");
        return;
      }
      e.preventDefault();

      if (e.key === "Escape") {
        render(recording, currentAccel(recording));
        recording = null;
        return;
      }
      if (e.key === "Backspace" || e.key === "Delete") {
        saveBinding(recording, null);
        recording = null;
        return;
      }

      const mods = [];
      if (e.metaKey) mods.push("Cmd");
      if (e.ctrlKey) mods.push("Ctrl");
      if (e.altKey) mods.push("Alt");
      if (e.shiftKey) mods.push("Shift");
      if (mods.length === 0 || !keyOk(e.code)) return; // keep listening

      const accel = mods.join("+") + "+" + e.code;
      const el = recording;
      recording = null;
      saveBinding(el, accel);
    });
  </script>
</body>
</html>
