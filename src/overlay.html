<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>toolshot overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.15);
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, "Segoe UI", sans-serif;
    }
    #highlight {
      position: fixed;
      display: none;
      border: 2px solid #4da3ff;
      background: rgba(77, 163, 255, 0.18);
      border-radius: 4px;
      pointer-events: none;
    }
    #label {
      position: fixed;
      display: none;
      background: rgba(20, 20, 24, 0.92);
      color: #eee;
      font-size: 12px;
      line-height: 1.4;
      padding: 5px 9px;
      border-radius: 6px;
      pointer-events: none;
      max-width: 420px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #label .dims { color: #9ab; }
    #hint {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 24, 0.85);
      color: #ddd;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 8px;
      pointer-events: none;
    }
    #hint kbd, #notice kbd {
      background: #333;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 12px;
    }
    #notice {
      position: fixed;
      display: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 20, 24, 0.95);
      color: #ddd;
      font-size: 14px;
      line-height: 1.6;
      padding: 18px 24px;
      border-radius: 10px;
      border: 1px solid #444;
      max-width: 480px;
      text-align: center;
      pointer-events: none;
    }
    #notice h2 {
      font-size: 15px;
      margin-bottom: 8px;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="highlight"></div>
  <div id="label"></div>
  <div id="hint">Click a window to capture it &nbsp;&middot;&nbsp; <kbd>Esc</kbd> or click empty space to cancel</div>
  <div id="notice"></div>
  <script>
    const invoke = window.__TAURI__.core.invoke;
    const highlight = document.getElementById("highlight");
    const label = document.getElementById("label");
    const notice = document.getElementById("notice");

    let windows = [];
    let current = null;
    let done = false;

    function showNotice(title, body) {
      notice.innerHTML = "";
      const h = document.createElement("h2");
      h.textContent = title;
      const p = document.createElement("div");
      p.innerHTML = body;
      notice.appendChild(h);
      notice.appendChild(p);
      notice.style.display = "block";
    }

    async function init() {
      const granted = await invoke("check_screen_permission").catch(() => false);
      if (!granted) {
        showNotice(
          "Screen Recording permission needed",
          "Enable it in System Settings &rarr; Privacy &amp; Security &rarr; " +
          "Screen &amp; System Audio Recording, then restart Toolshot.<br>" +
          "When running the raw binary from a terminal, the permission " +
          "belongs to the terminal app.<br><br>" +
          "<kbd>Esc</kbd> or click to close"
        );
        return;
      }
      try {
        windows = await invoke("list_windows");
      } catch (e) {
        showNotice("Could not list windows", String(e) + "<br><br><kbd>Esc</kbd> or click to close");
        return;
      }
      if (windows.length === 0) {
        showNotice("No windows to capture", "<kbd>Esc</kbd> or click to close");
      }
    }
    init();

    function windowAt(x, y) {
      // The list arrives sorted topmost first, so the first hit wins.
      for (const w of windows) {
        if (x >= w.x && x < w.x + w.width && y >= w.y && y < w.y + w.height) {
          return w;
        }
      }
      return null;
    }

    document.addEventListener("mousemove", (e) => {
      const w = windowAt(e.clientX, e.clientY);
      current = w;
      if (!w) {
        highlight.style.display = "none";
        label.style.display = "none";
        return;
      }
      highlight.style.display = "block";
      highlight.style.left = w.x + "px";
      highlight.style.top = w.y + "px";
      highlight.style.width = w.width + "px";
      highlight.style.height = w.height + "px";

      const name = w.title ? w.app_name + ": " + w.title : w.app_name;
      label.innerHTML = "";
      const nameSpan = document.createElement("span");
      nameSpan.textContent = name + "  ";
      const dims = document.createElement("span");
      dims.className = "dims";
      dims.textContent = w.width + "×" + w.height;
      label.appendChild(nameSpan);
      label.appendChild(dims);
      label.style.display = "block";
      label.style.left = Math.max(6, w.x + 8) + "px";
      label.style.top = Math.max(6, w.y - 30) + "px";
    });

    document.addEventListener("mousedown", (e) => {
      if (done) return;
      if (e.button !== 0 || !current) {
        invoke("cancel_overlay");
        return;
      }
      done = true;
      invoke("capture_window", { id: current.id }).catch((err) => {
        console.error("capture failed", err);
        done = false;
      });
    });

    document.addEventListener("contextmenu", (e) => e.preventDefault());

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") invoke("cancel_overlay");
    });
  </script>
</body>
</html>
