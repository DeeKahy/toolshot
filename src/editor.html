<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toolshot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b1c20;
      color: #ddd;
      font-family: -apple-system, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #232428;
      border-bottom: 1px solid #303138;
      flex: 0 0 auto;
    }
    #toolbar .tool {
      font-size: 12px;
      color: #ddd;
      background: #2a2b30;
      border: 1px solid #34353c;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
    #toolbar .tool:hover { background: #33343a; }
    #toolbar .tool.active {
      border-color: #4da3ff;
      color: #4da3ff;
    }
    #toolbar .tool.placeholder {
      color: #667;
      cursor: default;
    }
    #toolbar .tool.placeholder:hover { background: #2a2b30; }
    #color {
      width: 30px;
      height: 26px;
      padding: 0;
      border: 1px solid #34353c;
      border-radius: 6px;
      background: #2a2b30;
      cursor: pointer;
    }
    #toolbar .spacer { flex: 1; }
    #toolbar button.primary {
      font-size: 12px;
      color: #ddd;
      background: #3a6ea5;
      border: none;
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
    }
    #toolbar button.primary:hover { background: #4580bd; }
    #stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 16px;
      min-height: 0;
    }
    #shot {
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }
    #shot.armed { cursor: crosshair; }
    #status {
      flex: 0 0 auto;
      padding: 6px 12px;
      font-size: 12px;
      color: #889;
      background: #232428;
      border-top: 1px solid #303138;
      text-align: center;
    }
    #status kbd {
      background: #333;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <span class="tool" data-tool="rect">Rect</span>
      <span class="tool" data-tool="arrow">Arrow</span>
      <span class="tool placeholder" title="Coming soon">Draw</span>
      <span class="tool placeholder" title="Coming soon">Text</span>
      <span class="tool placeholder" title="Coming soon">Blur</span>
      <input type="color" id="color" value="#ff3b30" title="Annotation color" />
      <span class="tool" id="undoBtn" title="Undo (Cmd+Z)">Undo</span>
      <span class="spacer"></span>
      <button class="primary" id="copyBtn">Copy</button>
    </div>
    <div id="stage">
      <canvas id="shot"></canvas>
    </div>
    <div id="status"><kbd id="modKey">Cmd</kbd>+<kbd>C</kbd> copy and close &nbsp;&middot;&nbsp; <kbd id="modKey2">Cmd</kbd>+<kbd>Z</kbd> undo &nbsp;&middot;&nbsp; <kbd>Esc</kbd> close</div>
  </div>
  <script>
    const invoke = window.__TAURI__.core.invoke;
    const isMac = navigator.platform.toUpperCase().includes("MAC");
    if (!isMac) {
      document.getElementById("modKey").textContent = "Ctrl";
      document.getElementById("modKey2").textContent = "Ctrl";
    }

    const canvas = document.getElementById("shot");
    const ctx = canvas.getContext("2d");
    const colorInput = document.getElementById("color");

    let image = null;         // the captured screenshot
    let tool = null;          // "rect" | "arrow" | null
    let shapes = [];          // committed annotations
    let draft = null;         // shape being dragged right now
    let lineWidth = 6;        // in image pixels, set from image size on load

    invoke("get_capture_png")
      .then((b64) => {
        const img = new Image();
        img.onload = () => {
          image = img;
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          // Retina captures are 2x, keep strokes visually consistent.
          lineWidth = Math.max(4, Math.round(img.naturalWidth / 320));
          redraw();
        };
        img.src = "data:image/png;base64," + b64;
      })
      .catch((e) => console.error("failed to load capture", e));

    function drawShape(s) {
      ctx.strokeStyle = s.color;
      ctx.fillStyle = s.color;
      ctx.lineWidth = lineWidth;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      if (s.kind === "rect") {
        ctx.strokeRect(
          Math.min(s.x0, s.x1),
          Math.min(s.y0, s.y1),
          Math.abs(s.x1 - s.x0),
          Math.abs(s.y1 - s.y0)
        );
      } else if (s.kind === "arrow") {
        const angle = Math.atan2(s.y1 - s.y0, s.x1 - s.x0);
        const head = Math.max(lineWidth * 3.5, 14);
        // Stop the shaft short so it does not poke past the head.
        const endX = s.x1 - head * 0.6 * Math.cos(angle);
        const endY = s.y1 - head * 0.6 * Math.sin(angle);
        ctx.beginPath();
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(endX, endY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x1 - head * Math.cos(angle - 0.45), s.y1 - head * Math.sin(angle - 0.45));
        ctx.lineTo(s.x1 - head * Math.cos(angle + 0.45), s.y1 - head * Math.sin(angle + 0.45));
        ctx.closePath();
        ctx.fill();
      }
    }

    function redraw() {
      if (!image) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, 0, 0);
      for (const s of shapes) drawShape(s);
      if (draft) drawShape(draft);
    }

    // Mouse position in image pixels, the canvas is CSS-scaled to fit.
    function canvasPos(e) {
      const r = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - r.left) * (canvas.width / r.width),
        y: (e.clientY - r.top) * (canvas.height / r.height),
      };
    }

    for (const el of document.querySelectorAll(".tool[data-tool]")) {
      el.addEventListener("click", () => {
        const picked = el.dataset.tool;
        tool = tool === picked ? null : picked;
        for (const other of document.querySelectorAll(".tool[data-tool]")) {
          other.classList.toggle("active", other.dataset.tool === tool);
        }
        canvas.classList.toggle("armed", tool !== null);
      });
    }

    canvas.addEventListener("mousedown", (e) => {
      if (!tool || !image || e.button !== 0) return;
      const p = canvasPos(e);
      draft = { kind: tool, color: colorInput.value, x0: p.x, y0: p.y, x1: p.x, y1: p.y };
    });

    window.addEventListener("mousemove", (e) => {
      if (!draft) return;
      const p = canvasPos(e);
      draft.x1 = p.x;
      draft.y1 = p.y;
      redraw();
    });

    window.addEventListener("mouseup", () => {
      if (!draft) return;
      const tiny = Math.abs(draft.x1 - draft.x0) < 3 && Math.abs(draft.y1 - draft.y0) < 3;
      if (!tiny) shapes.push(draft);
      draft = null;
      redraw();
    });

    function undo() {
      shapes.pop();
      redraw();
    }
    document.getElementById("undoBtn").addEventListener("click", undo);

    function copyAndClose() {
      if (!image) return;
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const payload = new Uint8Array(8 + data.length);
      const view = new DataView(payload.buffer);
      view.setUint32(0, canvas.width, true);
      view.setUint32(4, canvas.height, true);
      payload.set(data, 8);
      invoke("copy_annotated", payload).catch((e) => console.error("copy failed", e));
    }
    document.getElementById("copyBtn").addEventListener("click", copyAndClose);

    document.addEventListener("keydown", (e) => {
      const mod = isMac ? e.metaKey : e.ctrlKey;
      if (mod && e.key.toLowerCase() === "c") {
        e.preventDefault();
        copyAndClose();
      } else if (mod && e.key.toLowerCase() === "z") {
        e.preventDefault();
        undo();
      } else if (e.key === "Escape") {
        if (draft) {
          draft = null;
          redraw();
        } else {
          invoke("close_editor");
        }
      }
    });
  </script>
</body>
</html>
