<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toolshot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b1c20;
      color: #ddd;
      font-family: -apple-system, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #232428;
      border-bottom: 1px solid #303138;
      flex: 0 0 auto;
    }
    #toolbar .tool {
      font-size: 12px;
      color: #667;
      background: #2a2b30;
      border: 1px solid #34353c;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: default;
    }
    #toolbar .spacer { flex: 1; }
    #toolbar button {
      font-size: 12px;
      color: #ddd;
      background: #3a6ea5;
      border: none;
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
    }
    #toolbar button:hover { background: #4580bd; }
    #stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 16px;
      min-height: 0;
    }
    #shot {
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }
    #status {
      flex: 0 0 auto;
      padding: 6px 12px;
      font-size: 12px;
      color: #889;
      background: #232428;
      border-top: 1px solid #303138;
      text-align: center;
    }
    #status kbd {
      background: #333;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <span class="tool" title="Coming soon">Rect</span>
      <span class="tool" title="Coming soon">Arrow</span>
      <span class="tool" title="Coming soon">Draw</span>
      <span class="tool" title="Coming soon">Text</span>
      <span class="tool" title="Coming soon">Blur</span>
      <span class="tool" title="Coming soon">Pick color</span>
      <span class="spacer"></span>
      <button id="copyBtn">Copy</button>
    </div>
    <div id="stage">
      <img id="shot" alt="captured screenshot" />
    </div>
    <div id="status"><kbd id="modKey">Cmd</kbd>+<kbd>C</kbd> copy and close &nbsp;&middot;&nbsp; <kbd>Esc</kbd> close</div>
  </div>
  <script>
    const invoke = window.__TAURI__.core.invoke;
    const isMac = navigator.platform.toUpperCase().includes("MAC");
    if (!isMac) document.getElementById("modKey").textContent = "Ctrl";

    invoke("get_capture_png")
      .then((b64) => {
        document.getElementById("shot").src = "data:image/png;base64," + b64;
      })
      .catch((e) => console.error("failed to load capture", e));

    function copyAndClose() {
      invoke("copy_capture").catch((e) => console.error("copy failed", e));
    }

    document.getElementById("copyBtn").addEventListener("click", copyAndClose);

    document.addEventListener("keydown", (e) => {
      const mod = isMac ? e.metaKey : e.ctrlKey;
      if (mod && e.key.toLowerCase() === "c") {
        e.preventDefault();
        copyAndClose();
      } else if (e.key === "Escape") {
        invoke("close_editor");
      }
    });
  </script>
</body>
</html>
