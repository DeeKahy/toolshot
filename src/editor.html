<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toolshot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b1c20;
      color: #ddd;
      font-family: -apple-system, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #232428;
      border-bottom: 1px solid #303138;
      flex: 0 0 auto;
    }
    #toolbar .tool {
      font-size: 12px;
      color: #ddd;
      background: #2a2b30;
      border: 1px solid #34353c;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
    #toolbar .tool:hover { background: #33343a; }
    #toolbar .tool.active {
      border-color: #4da3ff;
      color: #4da3ff;
    }
    #toolbar .tool.placeholder {
      color: #667;
      cursor: default;
    }
    #toolbar .tool.placeholder:hover { background: #2a2b30; }
    #color {
      width: 30px;
      height: 26px;
      padding: 0;
      border: 1px solid #34353c;
      border-radius: 6px;
      background: #2a2b30;
      cursor: pointer;
    }
    #toolbar .spacer { flex: 1; }
    #toolbar button.primary {
      font-size: 12px;
      color: #ddd;
      background: #3a6ea5;
      border: none;
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
    }
    #toolbar button.primary:hover { background: #4580bd; }
    #stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 16px;
      min-height: 0;
    }
    #shot {
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }
    #shot.armed { cursor: crosshair; }
    #status {
      flex: 0 0 auto;
      padding: 6px 12px;
      font-size: 12px;
      color: #889;
      background: #232428;
      border-top: 1px solid #303138;
      text-align: center;
    }
    #status kbd {
      background: #333;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <span class="tool" data-tool="rect">Rect</span>
      <span class="tool" data-tool="arrow">Arrow</span>
      <span class="tool" data-tool="blur">Blur</span>
      <span class="tool" data-tool="crop">Crop</span>
      <span class="tool placeholder" title="Coming soon">Draw</span>
      <span class="tool placeholder" title="Coming soon">Text</span>
      <input type="color" id="color" value="#ff3b30" title="Annotation color" />
      <span class="tool" id="undoBtn" title="Undo (Cmd+Z)">Undo</span>
      <span class="spacer"></span>
      <button class="primary" id="copyBtn">Copy</button>
    </div>
    <div id="stage">
      <canvas id="shot"></canvas>
    </div>
    <div id="status"><kbd id="modKey">Cmd</kbd>+<kbd>C</kbd> copy and close &nbsp;&middot;&nbsp; <kbd id="modKey2">Cmd</kbd>+<kbd>Z</kbd> undo &nbsp;&middot;&nbsp; <kbd>Esc</kbd> close</div>
  </div>
  <script>
    const invoke = window.__TAURI__.core.invoke;
    const isMac = navigator.platform.toUpperCase().includes("MAC");
    if (!isMac) {
      document.getElementById("modKey").textContent = "Ctrl";
      document.getElementById("modKey2").textContent = "Ctrl";
    }

    const canvas = document.getElementById("shot");
    const ctx = canvas.getContext("2d");
    const colorInput = document.getElementById("color");

    let image = null;         // the captured screenshot
    let tool = null;          // "rect" | "arrow" | "blur" | "crop" | null
    let shapes = [];          // committed annotations, in full-image coordinates
    let draft = null;         // shape being dragged right now
    let crop = null;          // {x, y, w, h} visible region, null = full image
    let history = [];         // undo entries: {kind:"shape"} | {kind:"crop", prev}
    let lineWidth = 6;        // in image pixels, set from image size on load
    const scratch = document.createElement("canvas"); // downscale buffer for blur

    // Shapes keep full-image coordinates even after cropping, the canvas is
    // just translated by the crop origin when drawing.
    function viewRect() {
      return crop || { x: 0, y: 0, w: image.naturalWidth, h: image.naturalHeight };
    }

    invoke("get_capture_png")
      .then((b64) => {
        const img = new Image();
        img.onload = () => {
          image = img;
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          // Retina captures are 2x, keep strokes visually consistent.
          lineWidth = Math.max(4, Math.round(img.naturalWidth / 320));
          redraw();
        };
        img.src = "data:image/png;base64," + b64;
      })
      .catch((e) => console.error("failed to load capture", e));

    function drawShape(s) {
      ctx.strokeStyle = s.color;
      ctx.fillStyle = s.color;
      ctx.lineWidth = lineWidth;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      if (s.kind === "rect") {
        ctx.strokeRect(
          Math.min(s.x0, s.x1),
          Math.min(s.y0, s.y1),
          Math.abs(s.x1 - s.x0),
          Math.abs(s.y1 - s.y0)
        );
      } else if (s.kind === "arrow") {
        const angle = Math.atan2(s.y1 - s.y0, s.x1 - s.x0);
        const head = Math.max(lineWidth * 3.5, 14);
        // Stop the shaft short so it does not poke past the head.
        const endX = s.x1 - head * 0.6 * Math.cos(angle);
        const endY = s.y1 - head * 0.6 * Math.sin(angle);
        ctx.beginPath();
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(endX, endY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x1 - head * Math.cos(angle - 0.45), s.y1 - head * Math.sin(angle - 0.45));
        ctx.lineTo(s.x1 - head * Math.cos(angle + 0.45), s.y1 - head * Math.sin(angle + 0.45));
        ctx.closePath();
        ctx.fill();
      } else if (s.kind === "blur") {
        const x = Math.min(s.x0, s.x1);
        const y = Math.min(s.y0, s.y1);
        const w = Math.abs(s.x1 - s.x0);
        const h = Math.abs(s.y1 - s.y0);
        if (w < 2 || h < 2) return;
        // Mosaic: shrink the region, then scale it back up with smoothing
        // off. Sampling the canvas rather than the image also blurs any
        // annotations drawn before this shape.
        const block = Math.max(6, Math.round(image.naturalWidth / 120));
        const sw = Math.max(1, Math.round(w / block));
        const sh = Math.max(1, Math.round(h / block));
        scratch.width = sw;
        scratch.height = sh;
        const v = viewRect();
        // Source coordinates are raw canvas pixels, unaffected by the crop
        // translation, so shift by the crop origin here.
        scratch.getContext("2d").drawImage(canvas, x - v.x, y - v.y, w, h, 0, 0, sw, sh);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(scratch, 0, 0, sw, sh, x, y, w, h);
        ctx.imageSmoothingEnabled = true;
      } else if (s.kind === "crop") {
        // Selection preview only: dim everything outside the dragged rect.
        const v = viewRect();
        const x = Math.min(s.x0, s.x1);
        const y = Math.min(s.y0, s.y1);
        const w = Math.abs(s.x1 - s.x0);
        const h = Math.abs(s.y1 - s.y0);
        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.beginPath();
        ctx.rect(v.x, v.y, v.w, v.h);
        ctx.rect(x, y, w, h);
        ctx.fill("evenodd");
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = Math.max(2, lineWidth / 2);
        ctx.setLineDash([lineWidth, lineWidth]);
        ctx.strokeRect(x, y, w, h);
        ctx.restore();
      }
    }

    function setCanvasSize() {
      const v = viewRect();
      canvas.width = v.w;
      canvas.height = v.h;
    }

    function redraw() {
      if (!image) return;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const v = viewRect();
      ctx.translate(-v.x, -v.y);
      ctx.drawImage(image, 0, 0);
      for (const s of shapes) drawShape(s);
      if (draft) drawShape(draft);
    }

    // Mouse position in full-image pixels, the canvas is CSS-scaled to fit
    // and shows the cropped region.
    function canvasPos(e) {
      const r = canvas.getBoundingClientRect();
      const v = viewRect();
      return {
        x: (e.clientX - r.left) * (canvas.width / r.width) + v.x,
        y: (e.clientY - r.top) * (canvas.height / r.height) + v.y,
      };
    }

    function setTool(next) {
      tool = next;
      for (const el of document.querySelectorAll(".tool[data-tool]")) {
        el.classList.toggle("active", el.dataset.tool === tool);
      }
      canvas.classList.toggle("armed", tool !== null);
    }

    for (const el of document.querySelectorAll(".tool[data-tool]")) {
      el.addEventListener("click", () => {
        const picked = el.dataset.tool;
        setTool(tool === picked ? null : picked);
      });
    }

    canvas.addEventListener("mousedown", (e) => {
      if (!tool || !image || e.button !== 0) return;
      const p = canvasPos(e);
      draft = { kind: tool, color: colorInput.value, x0: p.x, y0: p.y, x1: p.x, y1: p.y };
    });

    window.addEventListener("mousemove", (e) => {
      if (!draft) return;
      const p = canvasPos(e);
      draft.x1 = p.x;
      draft.y1 = p.y;
      redraw();
    });

    function applyCrop(d) {
      // Clamp to the visible region, the drag can leave the canvas.
      const v = viewRect();
      const x0 = Math.max(v.x, Math.min(d.x0, d.x1));
      const y0 = Math.max(v.y, Math.min(d.y0, d.y1));
      const x1 = Math.min(v.x + v.w, Math.max(d.x0, d.x1));
      const y1 = Math.min(v.y + v.h, Math.max(d.y0, d.y1));
      const w = Math.round(x1 - x0);
      const h = Math.round(y1 - y0);
      if (w < 10 || h < 10) return;
      history.push({ kind: "crop", prev: crop });
      crop = { x: Math.round(x0), y: Math.round(y0), w, h };
      setCanvasSize();
      setTool(null);
    }

    window.addEventListener("mouseup", () => {
      if (!draft) return;
      const tiny = Math.abs(draft.x1 - draft.x0) < 3 && Math.abs(draft.y1 - draft.y0) < 3;
      if (draft.kind === "crop") {
        if (!tiny) applyCrop(draft);
      } else if (!tiny) {
        shapes.push(draft);
        history.push({ kind: "shape" });
      }
      draft = null;
      redraw();
    });

    function undo() {
      const entry = history.pop();
      if (!entry) return;
      if (entry.kind === "shape") {
        shapes.pop();
      } else if (entry.kind === "crop") {
        crop = entry.prev;
        setCanvasSize();
      }
      redraw();
    }
    document.getElementById("undoBtn").addEventListener("click", undo);

    function copyAndClose() {
      if (!image) return;
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const payload = new Uint8Array(8 + data.length);
      const view = new DataView(payload.buffer);
      view.setUint32(0, canvas.width, true);
      view.setUint32(4, canvas.height, true);
      payload.set(data, 8);
      invoke("copy_annotated", payload).catch((e) => console.error("copy failed", e));
    }
    document.getElementById("copyBtn").addEventListener("click", copyAndClose);

    document.addEventListener("keydown", (e) => {
      const mod = isMac ? e.metaKey : e.ctrlKey;
      if (mod && e.key.toLowerCase() === "c") {
        e.preventDefault();
        copyAndClose();
      } else if (mod && e.key.toLowerCase() === "z") {
        e.preventDefault();
        undo();
      } else if (e.key === "Escape") {
        if (draft) {
          draft = null;
          redraw();
        } else {
          invoke("close_editor");
        }
      }
    });
  </script>
</body>
</html>
