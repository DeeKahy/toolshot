name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_BODY: "Downloads for macOS, Linux and Windows. See the README for install notes, macOS needs one Gatekeeper override since the app is unsigned."

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2

      - name: Build universal binaries
        run: |
          cargo build --release --workspace --target aarch64-apple-darwin
          cargo build --release --workspace --target x86_64-apple-darwin
          for bin in toolshot toolshot-ui; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin" \
              -output "$bin-universal"
          done

      # The bundle executable is the tray daemon; it spawns toolshot-ui
      # sitting next to it in MacOS/.
      - name: Build app bundle and dmg
        run: |
          app="Toolshot.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp toolshot-universal "$app/MacOS/toolshot"
          cp toolshot-ui-universal "$app/MacOS/toolshot-ui"
          cp src-tauri/icons/icon.icns "$app/Resources/icon.icns"
          version="${GITHUB_REF_NAME#v}"
          cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleName</key><string>Toolshot</string>
            <key>CFBundleDisplayName</key><string>Toolshot</string>
            <key>CFBundleIdentifier</key><string>dev.deekahy.toolshot</string>
            <key>CFBundleExecutable</key><string>toolshot</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          mkdir dmg-root
          cp -R Toolshot.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Toolshot -srcfolder dmg-root -ov -format UDZO \
            "Toolshot_${GITHUB_REF_NAME}_universal.dmg"
          # A version-free asset name so the Homebrew cask can always point
          # at releases/latest/download without needing a bump per release.
          cp "Toolshot_${GITHUB_REF_NAME}_universal.dmg" Toolshot_universal.dmg

      - uses: softprops/action-gh-release@v2
        with:
          name: "Toolshot ${{ github.ref_name }}"
          body: ${{ env.RELEASE_BODY }}
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: |
            Toolshot_${{ github.ref_name }}_universal.dmg
            Toolshot_universal.dmg

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxkbcommon-dev \
            libdbus-1-dev

      - uses: swatinem/rust-cache@v2

      - name: Build and package
        run: |
          cargo build --release --workspace
          tar -czf "toolshot_${GITHUB_REF_NAME}_linux_x86_64.tar.gz" \
            -C target/release toolshot toolshot-ui

      - uses: softprops/action-gh-release@v2
        with:
          name: "Toolshot ${{ github.ref_name }}"
          body: ${{ env.RELEASE_BODY }}
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: toolshot_${{ github.ref_name }}_linux_x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Build and package
        shell: bash
        run: |
          cargo build --release --workspace
          7z a "toolshot_${GITHUB_REF_NAME}_windows_x86_64.zip" \
            ./target/release/toolshot.exe ./target/release/toolshot-ui.exe

      - uses: softprops/action-gh-release@v2
        with:
          name: "Toolshot ${{ github.ref_name }}"
          body: ${{ env.RELEASE_BODY }}
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: toolshot_${{ github.ref_name }}_windows_x86_64.zip
