[package]
name = "toolshot-ui"
version = "0.2.3"
description = "Toolshot UI sessions: capture overlay, editor, color picker and settings"
authors = ["deekahy"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "toolshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
arboard = "3"
base64 = "0.22"
tauri-plugin-global-shortcut = "2"
auto-launch = "0.5"
